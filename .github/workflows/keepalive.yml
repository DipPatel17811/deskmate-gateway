name: Keep gateway warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --retry-all-errors --retry-delay 10 --max-time 120 \
            https://deskmate-gateway.onrender.com/healthz
